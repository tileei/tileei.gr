/* Διάταξη: κεφαλίδα με λογότυπο, μπλε «νυχτερινό» μπάντα με τίτλο και πόντους, μετά επιλογές, ερώτηση, χάρτης, ένα κύριο κουμπί.

:root {
  --bg: #eef4fc; --surface: #ffffff; --ink: #0d1f4a; --muted: #4d5f80; --line: #d3dff0;
  --brand: #0a47c2; --brand-ink: #ffffff; --sky: #139bf0; --sun: #e8680a; --sun-ink: #ffffff; --amber: #ffc20a;
  --night-a: #0b2a6f; --night-b: #0a47c2;
  --sea: #cfe6fb; --land: #ffffff; --land-edge: #0a47c2; --land-far: #dde7f3;
  --t0: #ffffff; --t1: #fff0d4; --t2: #e4e9fb; --t3: #fde2cf; --t4: #e2f3ee; --reg-ink: #34466f;
  --ok: #0b7a43; --mid: #b7791a; --bad: #a8261c; --halo: #ffffff;
  --font-display: 'Fira Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-body: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1328; --surface: #111c38; --ink: #e8eefc; --muted: #a2b2d3; --line: #243357;
    --brand: #6ea4ff; --brand-ink: #06122e; --sky: #4cc2ff; --sun: #ff9a3c; --sun-ink: #1b0d00; --amber: #ffcf40;
    --night-a: #08153a; --night-b: #0b2a6f;
    --sea: #0b1f47; --land: #22386f; --land-edge: #8db8ff; --land-far: #142246;
    --t0: #22386f; --t1: #3f3d68; --t2: #1d4a70; --t3: #4a3a57; --t4: #1f5058; --reg-ink: #dbe6fb;
    --ok: #4fd08a; --mid: #f0b45a; --bad: #ff8a80; --halo: #0a1328; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1328; --surface: #111c38; --ink: #e8eefc; --muted: #a2b2d3; --line: #243357;
  --brand: #6ea4ff; --brand-ink: #06122e; --sky: #4cc2ff; --sun: #ff9a3c; --sun-ink: #1b0d00; --amber: #ffcf40;
  --night-a: #08153a; --night-b: #0b2a6f;
  --sea: #0b1f47; --land: #22386f; --land-edge: #8db8ff; --land-far: #142246;
  --t0: #22386f; --t1: #3f3d68; --t2: #1d4a70; --t3: #4a3a57; --t4: #1f5058; --reg-ink: #dbe6fb;
  --ok: #4fd08a; --mid: #f0b45a; --bad: #ff8a80; --halo: #0a1328; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font: 17px/1.45 var(--font-body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 28px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 10; }
.bleed { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.top { background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 8px; }
.top-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: block; width: 112px; flex: none; }
.brand img { display: block; width: 100%; height: auto; }
.site { min-height: 44px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); color: var(--brand); text-decoration: none; font: 800 .9rem var(--font-display); }
.hero {
  color: #ffffff; padding-block: 18px 20px;
  background:
    radial-gradient(1.6px 1.6px at 8% 24%, rgba(255,255,255,.85) 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 27% 70%, rgba(255,255,255,.7) 50%, transparent 52%),
    radial-gradient(1.8px 1.8px at 46% 18%, rgba(255,255,255,.8) 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 63% 62%, rgba(255,255,255,.65) 50%, transparent 52%),
    radial-gradient(1.6px 1.6px at 78% 26%, rgba(255,255,255,.85) 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 92% 74%, rgba(255,255,255,.7) 50%, transparent 52%),
    linear-gradient(155deg, var(--night-a), var(--night-b));
}
.hero-in { max-width: 560px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.hero small { display: block; font: 800 .72rem/1.2 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--amber); margin-bottom: 6px; }
h1 { font: 900 italic 2.1rem/1 var(--font-display); margin: 0; letter-spacing: -0.01em; text-shadow: 0 3px 10px rgba(4,16,50,.45); }
h1::after { content: ""; display: block; height: 4px; width: 62%; margin-top: 8px; border-radius: 4px; background: #ff8a1f; }
.score { text-align: right; padding: 8px 14px 9px; border-radius: 14px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28); font-variant-numeric: tabular-nums; }
.score span { display: block; font: 800 .68rem/1.2 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.8); }
.score b { font: 900 1.55rem/1.1 var(--font-display); color: var(--amber); }
.wrap { max-width: 560px; margin: 0 auto; padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; min-height: 46px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 800 .95rem var(--font-display); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.ask { display: flex; align-items: flex-end; gap: 10px; min-height: 108px; }
.ask img { width: 66px; flex: none; height: auto; }
.bubble { position: relative; flex: 1; min-width: 0; background: var(--surface); border-radius: 16px 16px 16px 4px; padding: 10px 14px 12px; box-shadow: 0 6px 16px rgba(4,16,50,.14); margin-bottom: 14px; border-bottom: 3px solid var(--sun); }
.bubble .eyebrow { font: 800 .72rem/1.2 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--brand); display: flex; justify-content: space-between; gap: 8px; }
.bubble .big { font: 900 1.55rem/1.1 var(--font-display); margin: 4px 0 0; text-wrap: balance; overflow-wrap: anywhere; }
.bubble .sub { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
.dots { display: flex; gap: 5px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i.g { background: var(--ok); } .dots i.m { background: var(--mid); } .dots i.b { background: var(--bad); } .dots i.now { outline: 2px solid var(--brand); outline-offset: 1px; }
.mapbox { position: relative; border-radius: 16px; overflow: hidden; background: var(--sea); border: 2px solid var(--brand); margin-inline: -6px; }
svg#map { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; -webkit-user-select: none; user-select: none; }
.nb { fill: var(--land-far); }
.gr { fill: var(--land); stroke: var(--land-edge); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.t0 { fill: var(--t0); } .t1 { fill: var(--t1); } .t2 { fill: var(--t2); } .t3 { fill: var(--t3); } .t4 { fill: var(--t4); }
.nomos { fill: none; stroke: var(--land-edge); stroke-width: .8; stroke-dasharray: 4 3; stroke-linejoin: round; vector-effect: non-scaling-stroke; opacity: .6; pointer-events: none; }
.reg { font-family: var(--font-display); font-weight: 800; fill: var(--reg-ink); stroke: var(--land); paint-order: stroke; stroke-linejoin: round; text-anchor: middle; pointer-events: none; opacity: .9; }
.nom { font-family: var(--font-display); font-weight: 700; fill: var(--reg-ink); stroke: var(--land); paint-order: stroke; stroke-linejoin: round; text-anchor: middle; pointer-events: none; opacity: .92; }
.guess { fill: var(--sun); stroke: var(--halo); }
.truth { fill: var(--ok); stroke: var(--halo); }
.leg { stroke: var(--ink); stroke-dasharray: 5 5; vector-effect: non-scaling-stroke; stroke-width: 1.6; fill: none; opacity: .75; }
.lbl { font-family: var(--font-display); font-weight: 800; fill: var(--ink); stroke: var(--halo); paint-order: stroke; stroke-linejoin: round; }
.plane { fill: var(--sun); stroke: var(--halo); }
.zoom { position: absolute; right: 8px; top: 8px; display: grid; gap: 6px; }
.zoom button { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 800 1.3rem/1 var(--font-display); cursor: pointer; }
.regbtn { position: absolute; left: 8px; top: 8px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 700 .8rem var(--font-display); cursor: pointer; }
.regbtn[aria-pressed="false"] { color: var(--muted); }
.hint { position: absolute; left: 8px; bottom: 8px; max-width: 42%; margin: 0; padding: 4px 9px; border-radius: 999px; background: var(--surface); color: var(--muted); font-size: .8rem; }
.go { min-height: 54px; border: 0; border-radius: 999px; background: var(--sun); color: var(--sun-ink); font: 800 1.08rem var(--font-display); cursor: pointer; box-shadow: 0 8px 20px rgba(232,104,10,.35); }
.go:disabled { background: var(--line); color: var(--muted); box-shadow: none; cursor: default; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.end { background: var(--surface); border-radius: 16px; border-top: 4px solid var(--sun); padding: 14px 16px; display: grid; gap: 10px; }
.end h2 { font: 800 1.1rem var(--font-display); margin: 0; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-variant-numeric: tabular-nums; }
.rows li { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.rows .km { color: var(--muted); font-size: .92rem; }
.rows .pt { font: 800 1rem var(--font-display); min-width: 3.2em; text-align: right; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.acts button { flex: 1 1 140px; min-height: 48px; border-radius: 999px; border: 1.5px solid var(--brand); background: transparent; color: var(--brand); font: 800 1rem var(--font-display); cursor: pointer; }
.acts button.fill { background: var(--brand); color: var(--brand-ink); }
.share { width: 100%; min-height: 6.6em; resize: none; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); font: 600 .95rem/1.4 var(--font-body); padding: 8px 10px; }
.note { margin: 0; color: var(--muted); font-size: .9rem; }
.foot { margin: 0; color: var(--muted); font-size: .82rem; text-align: center; }
.foot a { color: var(--brand); }
</style>

    w = Math.max(W / 7, Math.min(W, w));
    var h = w * H / W;
    vb.w = w; vb.x = Math.max(0, Math.min(W - w, x)); vb.y = Math.max(0, Math.min(H - h, y));
    svg.setAttribute('viewBox', vb.x.toFixed(1) + ' ' + vb.y.toFixed(1) + ' ' + w.toFixed(1) + ' ' + h.toFixed(1));
    draw();
  }
  function el(name, attrs, text) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text) n.textContent = text;
    marks.appendChild(n); return n;
  }
  function drawResult(r, s, withLabel) {
    var p = PLACES[r.i], t = project(p[1], p[2]), g = project(r.lat, r.lon);
    el('line', { 'class': 'leg', x1: g[0], y1: g[1], x2: t[0], y2: t[1] });
    el('circle', { 'class': 'guess', cx: g[0], cy: g[1], r: 7 * s, 'stroke-width': 2 * s });
    el('circle', { 'class': 'truth', cx: t[0], cy: t[1], r: 7 * s, 'stroke-width': 2 * s });
    if (withLabel) {
      var left = t[0] > vb.x + vb.w * 0.62;
      el('text', { 'class': 'lbl', x: t[0] + (left ? -11 : 11) * s, y: t[1] + 5 * s, 'font-size': 14 * s, 'stroke-width': 4 * s, 'text-anchor': left ? 'end' : 'start' }, p[0]);
    }
  }
  function put(cls, x, y, name, fs, sw) {
    var t = el('text', { 'class': cls, x: x, y: y, 'font-size': fs, 'stroke-width': sw }), parts = name.split('|');
    parts.forEach(function (line, k) {
      var ts = document.createElementNS(NS, 'tspan');
      ts.setAttribute('x', x); ts.setAttribute('dy', k === 0 ? (0.35 - 0.55 * (parts.length - 1)) * fs : 1.1 * fs);
      ts.textContent = line; t.appendChild(ts);
    });
  }
  function draw() {
    var s = vb.w / (svg.getBoundingClientRect().width || 380);
    while (marks.firstChild) marks.removeChild(marks.firstChild);
    if (showReg || st.locked || st.done) {
      // Ονόματα μόνο στο ζουμ· όσο ψάχνεις φαίνονται μόνο αν ανοίξεις τη βοήθεια, μετά την απάντηση πάντα.
      var vh = vb.w * H / W;
      var inView = function (x, y) { return x > vb.x - 50 && x < vb.x + vb.w + 50 && y > vb.y - 20 && y < vb.y + vh + 20; };
      if (st.map === 'gr') {
        if (vb.w <= 700 && vb.w > 300) {
          MAP.reg.forEach(function (r) { var q = project(r[1], r[2]); if (inView(q[0], q[1])) put('reg', q[0], q[1], r[0], 9.5 * s, 3 * s); });
        } else if (vb.w <= 300) {
          MAP.nom.forEach(function (n) { if (inView(n[1], n[2])) put('nom', n[1], n[2], n[0], 9 * s, 2.5 * s); });
        }
      } else if (vb.w <= 800) {
        MAP.lab.forEach(function (n) { if (inView(n[1], n[2])) put('reg', n[1], n[2], n[0], 9.5 * s, 3 * s); });
      }
    }
    if (st.done) { st.results.forEach(function (r) { drawResult(r, s, true); }); return; }
    if (st.locked) { drawResult(st.results[st.results.length - 1], s, true); return; }
    if (st.pin) {
      var g = project(st.pin[0], st.pin[1]);
      el('circle', { 'class': 'guess', cx: g[0], cy: g[1], r: 8 * s, 'stroke-width': 2 * s });
    }
  }
  function dots() {
    var h = '';
    for (var i = 0; i < ROUNDS; i++) {
      var r = st.results[i];
      h += '<i class="' + (r ? tier(r.pts) : (i === st.round && !st.done ? 'now' : '')) + '"></i>';
    }
    $('dots').innerHTML = h;
  }
  function total() { return st.results.reduce(function (a, r) { return a + r.pts; }, 0); }
  function fmt(n) { return n.toLocaleString('el-GR'); }

  function ask() {
    var p = PLACES[st.order[st.round]];
    st.pin = null; st.locked = false;
    $('milis').src = IMG.point;
    $('eyebrow').textContent = 'ΓΥΡΟΣ ' + (st.round + 1) + ' ΑΠΟ ' + ROUNDS;
    $('big').textContent = p[0];
    $('sub').textContent = 'Πάτα στον χάρτη εκεί που νομίζεις ότι βρίσκεται.';
    $('go').disabled = true; $('go').textContent = 'Βάλε πινέζα στον χάρτη'; $('go').hidden = false;
    $('end').hidden = true; $('hint').hidden = false;
    $('total').textContent = fmt(total());
    dots(); setView(0, 0, W);
  }
  function start(mode, keep, mapId) {
    if (mapId && mapId !== st.map) { useMap(mapId); keep = false; }
    else if (!MAP) useMap(st.map);
    st.mode = mode; st.done = false;
    $('m_daily').setAttribute('aria-pressed', mode === 'daily'); $('m_free').setAttribute('aria-pressed', mode === 'free');
    $('modehelp').textContent = mode === 'daily' ? 'Οι ίδιοι 5 προορισμοί για όλους σήμερα. Αλλάζουν τα μεσάνυχτα.' : 'Τυχαίοι προορισμοί, όσες φορές θες.';
    if (!keep) { st.order = pick(mode === 'daily' ? rng('pou-petame-' + st.map + '-' + today()) : Math.random); st.round = 0; st.results = []; }
    ask();
  }
  function lock() {
    var i = st.order[st.round], p = PLACES[i], f = MAP.f;
    var d = km(st.pin[0], st.pin[1], p[1], p[2]), pts = points(d);
    st.results.push({ i: i, lat: st.pin[0], lon: st.pin[1], km: d, pts: pts });
    st.locked = true;
    var say, face;
    if (d <= 15 * f) { face = 'cheer'; say = 'Καρφί! ' + (d < 1 ? 'Λιγότερο από 1' : 'Μόλις ' + Math.round(d)) + ' χλμ. μακριά.'; }
    else if (d <= 60 * f) { face = 'thumb'; say = 'Πολύ κοντά: ' + fmt(Math.round(d)) + ' χλμ.'; }
    else if (d <= 150 * f) { face = 'point'; say = 'Σωστή γειτονιά, ' + fmt(Math.round(d)) + ' χλμ. πιο πέρα.'; }
    else { face = 'think'; say = 'Έπεσες ' + fmt(Math.round(d)) + ' χλμ. μακριά. Είναι: ' + p[3] + '.'; }
    $('milis').src = IMG[face];
    $('big').textContent = '+' + fmt(pts) + ' πόντοι';
    $('sub').textContent = say;
    $('total').textContent = fmt(total());
    $('hint').hidden = true;
    $('go').textContent = st.round + 1 < ROUNDS ? 'Επόμενος προορισμός' : 'Δες το αποτέλεσμα';
    dots();
    var a = project(st.pin[0], st.pin[1]), b = project(p[1], p[2]);
    var w = Math.max(260, Math.abs(a[0] - b[0]) * 1.5, Math.abs(a[1] - b[1]) * 1.5 * W / H);
    setView((a[0] + b[0]) / 2 - w / 2, (a[1] + b[1]) / 2 - w * H / W / 2, w);
    fly(a, b);
  }
  function fly(a, b) {
    if (reduce) return;
    var s = vb.w / (svg.getBoundingClientRect().width || 380);
    var ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI, t0 = null;
    var g = el('g', {}); marks.appendChild(g);
    var pl = document.createElementNS(NS, 'path');
    pl.setAttribute('class', 'plane'); pl.setAttribute('d', 'M14,0L-8,-9L-4,0L-8,9Z'); pl.setAttribute('stroke-width', 1.5);
    g.appendChild(pl);
    function step(ts) {
      if (!g.parentNode) return;
      if (t0 === null) t0 = ts;
      var u = Math.min(1, (ts - t0) / 700), e = 1 - Math.pow(1 - u, 3);
      g.setAttribute('transform', 'translate(' + (a[0] + (b[0] - a[0]) * e) + ',' + (a[1] + (b[1] - a[1]) * e) + ') rotate(' + ang + ') scale(' + s + ')');
      if (u < 1) requestAnimationFrame(step); else if (g.parentNode) g.parentNode.removeChild(g);
    }
    requestAnimationFrame(step);
  }
  function shareText() {
    var sq = st.results.map(function (r) { return { g: '🟩', m: '🟨', b: '🟥' }[tier(r.pts)]; }).join('');
    var d = today().split('-');
    return 'Πού πετάμε; ' + MAP.name + ' · ' + (st.mode === 'daily' ? d[2] + '/' + d[1] : 'Ελεύθερο') + '\n' + fmt(total()) + ' / ' + fmt(ROUNDS * 1000) + ' πόντοι\n' + sq + '\nΤι Λέει; Πετάμε!';
  }
  function finish() {
    st.done = true;
    var t = total();
    $('milis').src = t >= 3500 ? IMG.cheer : t >= 2000 ? IMG.thumb : IMG.think;
    $('eyebrow').textContent = (st.mode === 'daily' ? 'ΣΗΜΕΡΙΝΗ ΠΡΟΚΛΗΣΗ' : 'ΕΛΕΥΘΕΡΟ ΠΑΙΧΝΙΔΙ') + ' · ' + MAP.name.toUpperCase();
    $('big').textContent = fmt(t) + ' / ' + fmt(ROUNDS * 1000);
    $('sub').textContent = t >= 3500 ? 'Ξέρεις τον χάρτη απ’ έξω κι ανακατωτά.' : t >= 2000 ? 'Καλή πτήση. Με λίγη εξάσκηση, πας για κορυφή.' : 'Θέλει κι άλλα ταξίδια. Δοκίμασε ξανά.';
    $('go').hidden = true; $('end').hidden = false; $('hint').hidden = true;
    $('rows').innerHTML = st.results.map(function (r) {
      return '<li><span>' + PLACES[r.i][0] + '</span><span class="km">' + (r.km < 1 ? '<1' : fmt(Math.round(r.km))) + ' χλμ.</span><span class="pt">' + fmt(r.pts) + '</span></li>';
    }).join('');
    var bk = 'pp_best_' + st.map, best = parseInt(store(bk) || (st.map === 'gr' ? store('pp_best') : '') || '0', 10) || 0;
    if (t > best) { best = t; store(bk, String(t)); }
    var note = 'Καλύτερο σκορ σου (' + MAP.name + ') σε αυτή τη συσκευή: ' + fmt(best) + '.';
    if (st.mode === 'daily') {
      var key = 'pp_day_' + st.map + '_' + today(), first = store(key);
      if (first === null || first === undefined) store(key, String(t)); else note += ' Πρώτη σημερινή προσπάθεια: ' + fmt(parseInt(first, 10) || 0) + '.';
    }
    $('best').textContent = note;
    $('share').value = shareText();
    $('copy').textContent = 'Αντιγραφή για κοινοποίηση';
    dots(); setView(0, 0, W);
  }

  // --- Χειρισμός χάρτη: πάτημα = πινέζα, σύρσιμο = μετακίνηση, δύο δάχτυλα = ζουμ ------
  var ptrs = {}, n = 0, g0 = null;
  function rect() { return svg.getBoundingClientRect(); }
  function snap() {
    var ids = Object.keys(ptrs), r = rect();
    g0 = { x: vb.x, y: vb.y, w: vb.w, moved: g0 ? g0.moved : false, r: r };
    if (ids.length === 1) { g0.cx = ptrs[ids[0]].x; g0.cy = ptrs[ids[0]].y; }
    if (ids.length >= 2) {
      var a = ptrs[ids[0]], b = ptrs[ids[1]];
      g0.d = Math.hypot(a.x - b.x, a.y - b.y) || 1; g0.cx = (a.x + b.x) / 2; g0.cy = (a.y + b.y) / 2; g0.moved = true;
    }
  }
  svg.addEventListener('pointerdown', function (e) {
    try { svg.setPointerCapture(e.pointerId); } catch (x) {}
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY }; n++;
    if (n === 1) g0 = null;
    snap();
  });
  svg.addEventListener('pointermove', function (e) {
    if (!ptrs[e.pointerId] || !g0) return;
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(ptrs), r = g0.r;
    if (ids.length === 1) {
      var dx = e.clientX - g0.cx, dy = e.clientY - g0.cy;
      if (!g0.moved && Math.hypot(dx, dy) > 8) g0.moved = true;
      if (g0.moved) { var k = g0.w / r.width; setView(g0.x - dx * k, g0.y - dy * k, g0.w); }
    } else {
      var a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      var cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      var w = Math.max(W / 7, Math.min(W, g0.w * g0.d / d));
      var px = g0.x + (g0.cx - r.left) * g0.w / r.width, py = g0.y + (g0.cy - r.top) * g0.w / r.width;
      setView(px - (cx - r.left) * w / r.width, py - (cy - r.top) * w / r.width, w);
    }
  });
  function up(e) {
    if (!ptrs[e.pointerId]) return;
    var tap = n === 1 && g0 && !g0.moved && e.type === 'pointerup';
    delete ptrs[e.pointerId]; n--;
    if (tap && !st.locked && !st.done) {
      var r = rect(), x = vb.x + (e.clientX - r.left) * vb.w / r.width, y = vb.y + (e.clientY - r.top) * vb.w / r.width;
      st.pin = unproject(x, y);
      $('go').disabled = false; $('go').textContent = 'Κλείδωσε την απάντηση';
      draw();
    }
    if (n > 0) snap(); else g0 = null;
  }
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  svg.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = rect(), f = e.deltaY > 0 ? 1.2 : 1 / 1.2, w = Math.max(W / 7, Math.min(W, vb.w * f));
    var px = vb.x + (e.clientX - r.left) * vb.w / r.width, py = vb.y + (e.clientY - r.top) * vb.w / r.width;
    setView(px - (e.clientX - r.left) * w / r.width, py - (e.clientY - r.top) * w / r.width, w);
  }, { passive: false });
  function zoomBy(f) {
    var h = vb.w * H / W, cx = vb.x + vb.w / 2, cy = vb.y + h / 2;
    if (st.pin && !st.locked) { var g = project(st.pin[0], st.pin[1]); cx = g[0]; cy = g[1]; }
    var w = Math.max(W / 7, Math.min(W, vb.w * f));
    setView(cx - w / 2, cy - w * H / W / 2, w);
  }
  $('regbtn').addEventListener('click', function () {
    showReg = !showReg; this.setAttribute('aria-pressed', showReg); draw();
  });
  $('z_in').addEventListener('click', function () { zoomBy(1 / 1.6); });
  $('z_out').addEventListener('click', function () { zoomBy(1.6); });

  $('go').addEventListener('click', function () {
    if (st.done) return;
    if (!st.locked) { if (st.pin) lock(); return; }
    if (st.round + 1 < ROUNDS) { st.round++; ask(); } else finish();
  });
  $('map_gr').addEventListener('click', function () { start(st.mode, false, 'gr'); });
  $('map_eu').addEventListener('click', function () { start(st.mode, false, 'eu'); });
  $('m_daily').addEventListener('click', function () { start('daily'); });
  $('m_free').addEventListener('click', function () { start('free'); });
  $('again').addEventListener('click', function () { start('free'); window.scrollTo(0, 0); });
  $('copy').addEventListener('click', function () {
    var ta = $('share');
    function fallback() { ta.focus(); ta.select(); $('copy').textContent = 'Επιλέχθηκε: αντίγραψέ το'; }
    try { navigator.clipboard.writeText(ta.value).then(function () { $('copy').textContent = 'Αντιγράφηκε'; }, fallback); } catch (e) { fallback(); }
  });
  window.addEventListener('resize', draw);

  // --- Εκκίνηση (κρατά την παρτίδα αν η σελίδα ενημερωθεί ενώ παίζεις) ------------------
  function boot(saved) {
    var id = saved && MAPS[saved.map] ? saved.map : 'gr';
    st.map = id; useMap(id);
    if (saved && saved.order && saved.order.length === ROUNDS && saved.order.every(function (i) { return PLACES[i]; })) {
      st.order = saved.order; st.results = saved.results || []; st.round = Math.min(st.results.length, ROUNDS - 1);
      st.mode = saved.mode === 'free' ? 'free' : 'daily';
      if (st.results.length >= ROUNDS) { start(st.mode, true); finish(); } else start(st.mode, true);
    } else start('daily');
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { map: st.map, mode: st.mode, order: st.order, results: st.results }; });
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || null);
})();
</script>
</body>
</html>
